<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growth Intelligence · Product Walkthrough</title>
<style>
:root{--navy:#0f1b33;--navy2:#1a2a4a;--bg:#f5f7fb;--card:#fff;--line:#e3e8f0;--tx:#16213a;--mut:#667189;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);background:var(--bg)}
#app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{background:var(--navy);color:#cbd5e8;display:flex;flex-direction:column;padding:20px 12px;overflow:auto}
.brand{padding:0 10px 20px;color:#fff;font-size:20px;font-weight:700;line-height:1.15}
nav a{display:block;padding:8px 10px;border-radius:8px;color:#cbd5e8;text-decoration:none;margin-bottom:2px}
nav a b{display:block;font-weight:600;font-size:13.5px}nav a span{font-size:11.5px;color:#8fa0bf}
nav a:hover{background:var(--navy2)}nav a.on{background:var(--blue);color:#fff}nav a.on span{color:#dbe7ff}
.ai{margin-top:auto;background:var(--navy2);border-radius:10px;padding:14px;font-size:12.5px}.ai b{color:#fff;display:block;margin-bottom:4px}
.ai p{margin:0 0 10px}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{height:64px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.ws{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;background:#fff;cursor:pointer;font:inherit;font-weight:600}
.ws:after{content:" ▾";color:var(--mut)}
header input{flex:1;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;background:var(--bg)}
.sp{flex:1}
.pill{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:#fff;font:inherit;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
#content{flex:1;overflow:auto;padding:28px 32px 48px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px;max-width:760px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.grid{display:grid;gap:16px;margin-bottom:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1250px){.g6,.g4{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(15,27,51,.05)}
.card h3{margin:0 0 10px;font-size:14.5px}.card p{margin:0 0 8px;color:var(--mut)}
.k .l{color:var(--mut);font-size:12.5px}.k .v{font-size:26px;font-weight:700;margin:2px 0}.k .n{font-size:12px;color:var(--mut)}
.k .ph{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px);margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;margin:0 6px 6px 0;color:var(--tx)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover{filter:brightness(.96)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#eef1f6;color:var(--mut);margin-right:4px}
.tag.g{background:#dcfce7;color:#166534}.tag.a{background:#fef3c7;color:#92400e}.tag.r{background:#fee2e2;color:#991b1b}.tag.pu{background:#ede9fe;color:#5b21b6}.tag.b{background:#dbeafe;color:#1e40af}
.empty{border:1px dashed #c8d1e0;border-radius:10px;padding:26px;text-align:center;color:var(--mut);background:#fafbfd}.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
ul.chk{list-style:none;margin:0 0 12px;padding:0}ul.chk li{padding:5px 0;display:flex;gap:10px}.ok{color:var(--green);font-weight:700}.todo{color:#9aa6bd}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.list2{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}.list2 div b{display:block;font-size:13px}.list2 div span{color:var(--mut);font-size:12.5px}
.funnel{display:flex;gap:8px;align-items:stretch}.funnel div{flex:1;border:1px dashed #c8d1e0;border-radius:10px;padding:14px;text-align:center;background:#fafbfd}.funnel b{display:block}.funnel span{color:var(--mut);font-size:12px}
.drag{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:6px;cursor:grab}.drag:before{content:"⋮⋮";color:#9aa6bd}.drag.over{border-color:var(--blue)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.ill{border:1px dashed var(--purple);background:#faf8ff}
.share-note{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px}
#drawer{position:fixed;top:0;right:-440px;width:420px;height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(15,27,51,.12);transition:right .2s;z-index:10;display:flex;flex-direction:column}
#drawer.open{right:0}#drawer .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
#drawer .bd{flex:1;overflow:auto;padding:18px}.msg{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px}.msg.u{background:#dbeafe;margin-left:40px}
</style></head><body>
<div id="app">
<aside><div class="brand">Growth<br>Intelligence</div><nav id="nav"></nav>
<div class="ai"><b>AI Assistant</b><p>Explore the assistant’s intended role. Live AI and company data are not connected in this public walkthrough.</p><button class="btn p" onclick="openAI()" style="margin:0">Start a conversation</button></div></aside>
<main><div style="padding:8px 20px;background:#e8efff;color:#234681;font-size:12px;font-weight:600">Public product walkthrough · Example workspace · No live company data or connections</div><header><button class="ws">Example workspace</button><input placeholder="Search" aria-label="Search"><span class="sp"></span><button class="pill">Date range: Select</button><button class="pill" aria-label="Notifications">🔔</button><div class="av">U</div></header>
<div id="content"></div></main></div>
<div id="drawer"><div class="hd">AI Assistant<button class="btn" onclick="closeD()" style="margin:0">Close</button></div><div class="bd" id="dbd"></div></div>
<script>

const $=s=>document.querySelector(s);
const NAV=[["command","Command Center","Overview & priorities"],["seo","SEO / GEO / AEO","Technical, content & visibility"],["paid","Paid Campaigns","Google, Meta, LinkedIn"],["pipeline","Pipeline & Sales","Leads, pipeline & revenue"],["experiments","Experiments","Ideas, tests & results"],["bi","BI & Reports","Reports & analytics"],["signals","Signals & Alerts","Opportunities & risks"],["automations","Automations","Repetitive work & efficiency"],["admin","Admin / Integrations","Data sources & settings"]];
const kpi=(l,v,n)=>`<div class="card k"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div><div class="ph"></div></div>`;
const kp=(a,c)=>`<div class="grid ${c||'g3'}">${a.map(x=>kpi(...x)).join('')}</div>`;
const card=(t,h)=>`<div class="card"><h3>${t}</h3>${h}</div>`;
const empty=(t,s,b)=>`<div class="empty"><b>${t}</b>${s}${b?`<div style="margin-top:12px">${b}</div>`:''}</div>`;
const btn=(t,p)=>`<button class="btn ${p?'p':''}" onclick="toast('${t.replace(/'/g,"\\'")}')">${t}</button>`;
const list=a=>`<div class="list2">${a.map(x=>`<div><b>${x[0]}</b><span>${x[1]||''}</span></div>`).join('')}</div>`;
const tbl=(h,rows,msg)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" style="text-align:center;color:var(--mut);padding:26px">${msg}</td></tr>`}</table></div>`;
const NS='<span class="tag a">Not scanned</span>';
const RQ='<span class="tag">Requires scan</span>';

function closeD(){$('#drawer').classList.remove('open')}
function showPanel(title,body){$('#dbd').replaceChildren();const h=document.createElement('h3');h.textContent=title;$('#dbd').append(h);const p=document.createElement('p');p.textContent=body;$('#dbd').append(p);$('#drawer').classList.add('open')}
function toast(t){showPanel(t,'This is a public visual walkthrough of Growth Intelligence. Live data connections and company workspaces are unavailable here. Explore the navigation and report layouts to see the product.');}
function openAI(){showPanel('Growth Intelligence assistant','In the private review app, the assistant retrieves saved workspace evidence and shows its sources. This public walkthrough contains no company audit or live AI connection.');}
function go(p){location.hash=p}
const ph=(t)=>empty(t,'No connected data in this public walkthrough.',btn('View integrations',1).replace("toast('View integrations')","go('admin')"));
const setup=[['Example workspace',1],['Connect Google Analytics 4'],['Connect Search Console'],['Connect ad platforms'],['Connect CRM'],['Plan first experiment']];
const P={
command:{t:'Welcome to Growth Intelligence',s:'Explore the actual product interface: connect evidence, review performance, plan experiments and organise reporting. This public example workspace contains no business data.',tabs:['Overview'],r:()=>
kp([['Organic traffic','—','Connect GA4 + Search Console'],['Paid spend','—','Connect ad platforms'],['Leads','—','Connect CRM'],['Pipeline','—','Connect CRM'],['Conversion rate','—','Awaiting analytics data'],['Experiments','0','Example workspace']],'g6')+
'<div class="grid g2">'+card('Workspace setup','<ul class="chk">'+setup.map(x=>`<li><span class="${x[1]?'ok':'todo'}">${x[1]?'✓':'○'}</span>${x[0]}</li>`).join('')+'<button class="btn p" onclick="go(\'admin\')">Explore integrations</button>')+
card('Explore the product','<p>Use the sidebar to browse the application. Metrics stay unavailable until real sources are connected.</p><button class="btn p" onclick="go(\'seo\')">SEO / GEO / AEO</button><button class="btn" onclick="go(\'experiments\')">Growth Lab</button><button class="btn" onclick="go(\'bi\')">BI & Reports</button>')+'</div>'+card('From insight to action',list([['Evidence','Bring source information into one workspace'],['Experiments','Record hypotheses, primary metrics and guardrails'],['Reporting','Organise KPIs and review results'],['Assistant','Retrieve saved evidence with source context']]))},
seo:{t:'SEO / GEO / AEO',s:'Review technical search, content and answer readiness in one workspace. The private company audit is excluded from this public preview.',tabs:['Overview','Technical SEO','Indexing & Crawl','Structured Data','Content & Entities','Keywords','GEO','AEO','Opportunities'],r:t=>kp([['SEO readiness','—','No public example audit'],['GEO readiness','—','Requires evidence'],['AEO readiness','—','Requires evidence']])+card(t+' review',empty('No audit loaded','This view shows the product layout without publishing company findings, URLs or scores.'))+'<div class="grid g2">'+card('Evidence to review',list([['Technical','Crawlability, metadata and performance'],['Content','Page purpose, topics and entity clarity'],['Answer readiness','Question coverage and source context'],['Performance','Search Console and analytics after connection']]))+card('Next step','<p>Connect a website and measurement sources in the full environment.</p><button class="btn p" onclick="go(\'admin\')">View source options</button>')+'</div>'},
paid:{t:"Paid Campaigns",s:"Connect ad platforms to monitor spend, efficiency and pipeline outcomes.",tabs:["Overview","Google Ads","Meta Ads","LinkedIn Ads","Campaign Recommendations"],r:t=>{
if(t=="Overview")return kp([["Spend","—","Not connected"],["Impressions","—","Not connected"],["Clicks","—","Not connected"],["CTR","—","Not connected"],["Leads","—","Connect CRM"],["CPL","—","Not connected"],["Opportunities","—","Connect CRM"],["Pipeline","—","Connect CRM"],["ROAS","—","Not connected"]],'g4')+`<div class="grid g3">${["Google Ads","Meta Ads","LinkedIn Ads"].map(x=>card("Connect "+x,`<p><span class="tag">Not connected</span></p>`+btn("Connect "+x,1))).join('')}</div>`+card("Campaigns",tbl(["Campaign","Platform","Spend","Impressions","Clicks","CTR","Conversions","CPL","Opportunities","Pipeline","ROAS"],[],"No campaign data connected."))+`<div class="grid g2" style="margin-top:16px">`+card("What we will monitor",list(["Budget pacing","Spend anomalies","CTR changes","CPC changes","CPL changes","Audience saturation","Creative fatigue","Search-term waste","Lead quality","MQL / SQL quality","Opportunity creation","Pipeline attribution","ROAS","Account-level engagement"].map(x=>[x])))+card("Recommendations after connection",`<p>Capabilities, not current recommendations.</p>`+list(["Reallocate budget","Pause waste","Refresh creative","Review audience overlap","Review search terms","Detect saturation","Identify high-quality campaigns","Connect campaign → CRM outcomes"].map(x=>[x])))+`</div>`;
if(t=="Campaign Recommendations")return empty("No recommendations","Recommendations need connected campaign and CRM data.",btn("Open integrations",1).replace("toast('Open integrations')","go('admin')"));
return empty("Connect "+t,"No campaign data connected.",btn("Connect "+t,1))}},
pipeline:{t:"Pipeline & Sales",s:"An empty data model, ready for CRM data.",tabs:["Overview"],r:()=>kp([["Leads","—","Connect CRM"],["MQL","—","Connect CRM"],["SQL","—","Connect CRM"],["Opportunities","—","Connect CRM"],["Pipeline","—","Connect CRM"],["Won ARR","—","Connect CRM"],["Sales cycle","—","Connect CRM"]],'g4')+card("Funnel",`<div class="funnel">${["Visitors","Leads","MQL","SQL","Opportunity","Won"].map(x=>`<div><b>${x}</b><span>No data</span></div>`).join('')}</div>`)+`<div class="grid g2" style="margin-top:16px">`+card("Attribution capabilities",list(["First touch","Last touch","Multi-touch","Campaign influenced","Content influenced","Organic influenced","Paid influenced"].map(x=>[x])))+card("ABM / Account intelligence",list(["Target account activity","Website engagement","Content interactions","Campaign interactions","Form activity","Sales activity","Intent change"].map(x=>[x]))+`<p style="margin-top:12px"><span class="tag">Available after CRM and account data are connected.</span></p>`)+`</div>`},
experiments:{t:"Experiments / Growth Lab",s:"Plan, run and remember growth experiments.",tabs:["Overview","Active Tests","Backlog","Completed","Experiment Memory"],r:t=>{
if(t=="Overview")return kp([["Active experiments","0","None configured"],["Completed experiments","0","None yet"],["Backlog","0","None yet"]])+empty("No experimentation history yet.","Create your first experiment or import your history.",btn("Create first experiment",1)+btn("Import experiment history"))+`<div class="grid g2" style="margin-top:16px">`+card("What this module supports",list(["Hypothesis management","Target segments","Primary metrics","Guardrail metrics","Experiment design","Prioritization","Impact monitoring","Risk assessment","Short-term impact","Long-term impact","Experiment memory","Related experiments","Contradicting findings","External evidence"].map(x=>[x])))+`<div class="card ill"><h3>Experiment template <span class="tag pu">Example template</span></h3>${list(["Problem","Hypothesis","Audience","Primary KPI","Guardrail","Expected learning","Evidence","Risk","Owner","Duration","Status"].map(x=>[x,"Empty field"]))}</div></div>`;
return empty("Nothing here yet",t=="Experiment Memory"?"Learnings from completed experiments will be stored here.":"No experiments configured.",btn("Create first experiment",1))}},
bi:{t:"BI & Reports",s:"Build views, organize KPIs and schedule reports.",tabs:["Executive","Marketing","SEO","Campaigns","Pipeline","Content","Experiments","Custom"],r:t=>{
const acts=["Save View","Export","Share","Schedule Report","Add KPI","Add Chart"].map(x=>btn(x,x=="Add KPI")).join('');
if(t!="Executive"&&t!="Custom")return `<p>${acts}</p>`+ph(t+" dashboard");
return `<p>${acts}</p>`+kp([["Website sessions","—","Not connected"],["Qualified leads","—","Not connected"],["Pipeline","—","Not connected"],["Paid spend","—","Not connected"],["Organic conversions","—","Not connected"],["Experiments","—","Not connected"]])+`<p style="color:var(--mut)">Connect data sources to populate this dashboard.</p><div class="grid g2">`+card("KPI organizer",`<p>Drag to reorder.</p><div id="dl">${["Organic sessions","Paid spend","Leads","MQL","SQL","Pipeline","Won ARR","CPL","CAC","ROAS","SEO clicks","SEO impressions","Conversion rate"].map(x=>`<div class="drag" draggable="true">${x}</div>`).join('')}</div>`)+`<div>`+card("Export options",`${btn("PDF")}${btn("CSV")}${btn("XLSX")}`)+`<div style="height:16px"></div>`+card("Scheduled reports",tbl(["Report","Status"],["Weekly marketing summary","Monthly management report","SEO/GEO audit digest","Campaign performance summary","Pipeline contribution report"].map(x=>[x,'<span class="tag">Not configured</span>']),""))+`</div></div>`}},
signals:{t:"Signals & Alerts",s:"Monitoring signals appear here once data is flowing.",tabs:["All","Critical","Attention","Opportunity","SEO","Paid","Content","Pipeline","Experiment","Technical"],r:t=>empty("No monitoring signals yet."+(t!="All"?" ("+t+")":""),"Signals will appear here after data sources are connected.")+`<div class="card ill" style="margin-top:16px"><h3>Example signal format <span class="tag pu">Illustrative, not a real alert</span></h3>${list([["What happened","Plain description of the change"],["Why it matters","Business impact in context"],["Evidence","Metrics and sources"],["Recommended action","Specific next step"],["Confidence","Low / Medium / High"],["Owner","Assigned person"],["Status","New / Investigating / Resolved"]])}</div>`},
automations:{t:"Automations & Efficiency",s:"Reduce repetitive marketing work. Nothing is configured yet.",tabs:["Overview"],r:()=>kp([["Automations active","0","None configured"],["Reports scheduled","0","None configured"],["Time saved","—","Awaiting active automations"],["Alerts generated","0","No alerts yet"]],'g4')+`<div class="grid g3">`+[["Daily checks",["SEO/indexing anomalies","Campaign spend anomalies","Conversion drops","Broken pages","CRM sync issues"]],["Weekly",["Marketing performance summary","SEO performance summary","Campaign summary","Content opportunities","Pipeline contribution summary"]],["Monthly",["Management report","Content audit","SEO/GEO/AEO audit","Experiment learning report","Channel efficiency review"]]].map(c=>card(c[0],c[1].map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${x}<br><span class="tag">Not configured</span></div>`).join(''))).join('')+`</div><p style="margin-top:16px">${btn("Set up automation",1)}${btn("Choose schedule")}${btn("Choose source")}${btn("Choose recipients")}</p>`},

admin:{t:'Integrations',s:'Source categories supported by the product design. No live accounts are connected in this public walkthrough.',tabs:['All','Marketing & Ads','CRM & Sales','Analytics','SEO','Data Warehouse','LLM & AI','BI & Export','Notifications'],r:t=>{
const C={'Marketing & Ads':['Google Ads','Meta Ads','LinkedIn Ads'],'CRM & Sales':['HubSpot','Salesforce','Pipedrive'],'Analytics':['Google Analytics 4','Google Tag Manager'],'SEO':['Google Search Console','Website audit'],'Data Warehouse':['PostgreSQL','BigQuery','Snowflake'],'LLM & AI':['OpenAI','Anthropic','Google Gemini'],'BI & Export':['Looker Studio','Power BI','CSV / XLSX / PDF'],'Notifications':['Email','Slack','Microsoft Teams']};
return (t==='All'?Object.keys(C):[t]).map(k=>`<h3>${k}</h3><div class="grid g3">${C[k].map(x=>card(x,'<p><span class="tag">Not connected</span></p><p>No account access granted.</p>'+btn('Configure '+x))).join('')}</div>`).join('');}}
};
let tab={};
function render(){
let id=(location.hash||"#command").slice(1);if(id==="content"){id="seo";location.hash="seo";}const pg=P[id]||P.command;const key=P[id]?id:"command";
$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==key?'on':''}"><b>${n[1]}</b><span>${n[2]}</span></a>`).join('');
const t=tab[key]&&pg.tabs.includes(tab[key])?tab[key]:pg.tabs[0];
$('#content').innerHTML=`<h1>${pg.t}</h1><p class="sub">${pg.s}</p>`+(pg.tabs.length>1?`<div class="tabs">${pg.tabs.map(x=>`<button class="${x==t?'on':''}" data-t="${x}">${x}</button>`).join('')}</div>`:'')+pg.r(t)+`<div class="share-note">Public product walkthrough · No company data, live connections or backend access.</div>`;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab[key]=b.dataset.t;render()});
const dl=$('#dl');if(dl){let d;dl.querySelectorAll('.drag').forEach(e=>{e.ondragstart=()=>d=e;e.ondragover=ev=>{ev.preventDefault();e.classList.add('over')};e.ondragleave=()=>e.classList.remove('over');e.ondrop=()=>{e.classList.remove('over');if(d&&d!==e){const r=[...dl.children];dl.insertBefore(d,r.indexOf(d)<r.indexOf(e)?e.nextSibling:e)}}})}
$('#content').scrollTop=0}
window.onhashchange=render;render();

const baseToast=toast;
toast=function(t){
 if(t==='Save View'){sessionStorage.setItem('gi-preview-kpis',JSON.stringify([...document.querySelectorAll('#dl .drag')].map(x=>x.textContent)));showPanel('View saved','The KPI order is saved for this browser tab only. It does not change the private application.');return;}
 if(t==='Create first experiment'){
  $('#dbd').innerHTML='<h3>Plan an experiment</h3><p>Preview only. Use fictional information. Nothing is sent to a server.</p><form id="preview-experiment"><label>Experiment name<input name="name" required maxlength="120" style="width:100%;padding:10px;margin:6px 0 14px"></label><label>Hypothesis<textarea name="hypothesis" required maxlength="500" style="width:100%;padding:10px;margin:6px 0 14px"></textarea></label><label>Primary metric<input name="metric" required maxlength="100" style="width:100%;padding:10px;margin:6px 0 14px"></label><button class="btn p">Preview plan</button></form>';
  $('#drawer').classList.add('open');$('#preview-experiment').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;const values=new FormData(f);showPanel('Experiment plan',String(values.get('name'))+' — '+String(values.get('hypothesis'))+' | Primary metric: '+String(values.get('metric'))+'. This plan is displayed in memory only.');};return;
 }
 baseToast(t);
};
document.querySelector('header .ws').onclick=()=>showPanel('Example workspace','This public workspace is isolated from the private application and contains no company data.');
document.querySelector('header [aria-label="Notifications"]').onclick=()=>showPanel('Notifications','No alerts in this public example workspace.');
document.querySelector('header .pill:not([aria-label])').onclick=()=>showPanel('Date range','This visual preview has no connected reporting data to filter. Date preferences are available in the private review application.');
const search=document.querySelector('header input');search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=search.value.toLowerCase();const match=NAV.find(n=>(n[1]+' '+n[2]).toLowerCase().includes(q));if(match&&q){location.hash=match[0];search.value='';}}});

</script><link rel="stylesheet" href="responsive.css"><script src="responsive.js"></script></body></html>
